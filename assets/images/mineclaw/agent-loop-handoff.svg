<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img" aria-labelledby="title desc">
<title id="title">主脑与任务会话如何交接</title><desc id="desc">玩家提出交付目标。主脑经 GoalAgentPort 派发，立刻获得受理回执。GoalAgent 运行若干轮，再把结果和证据传回主脑。</desc>
<defs>
<marker id="arr-teal" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6"><path d="M 1 2 L 9 6 L 1 10" fill="none" stroke="#00685d" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arr-blue" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6"><path d="M 1 2 L 9 6 L 1 10" fill="none" stroke="#275697" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arr-ochre" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6"><path d="M 1 2 L 9 6 L 1 10" fill="none" stroke="#91511f" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arr-muted" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6"><path d="M 1 2 L 9 6 L 1 10" fill="none" stroke="#465e67" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
<rect x="0" y="0" width="680" height="680" rx="0" fill="#faf9f3"/>
<text x="30" y="37" fill="#00685d" font-size="16" font-weight="650" text-anchor="start">MainBrain  /  GoalAgent</text>
<text x="28" y="82" fill="#173341" font-size="36" font-weight="700" text-anchor="start">主脑与任务会话如何交接</text>
<text x="30" y="117" fill="#465e67" font-size="20" font-weight="450" text-anchor="start">玩家说「去我左边的箱子拿一把铁镐给我。」</text>
<rect x="24" y="143" width="270" height="462" rx="12" fill="#e9effa"/>
<rect x="386" y="143" width="270" height="462" rx="12" fill="#def1e9"/>
<text x="42" y="182" fill="#275697" font-size="26" font-weight="680" text-anchor="start">对话循环</text>
<text x="42" y="208" fill="#275697" font-size="17" font-weight="550" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">MainBrain</text>
<text x="404" y="182" fill="#00685d" font-size="26" font-weight="680" text-anchor="start">任务循环</text>
<text x="404" y="208" fill="#00685d" font-size="17" font-weight="550" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GoalAgent</text>
<rect x="36" y="238" width="246" height="75" rx="12" fill="#ffffff" stroke="#c7d5d0" stroke-width="1.5"/>
<rect x="37" y="251" width="4" height="48" rx="2" fill="#275697"/>
<text x="51" y="269" fill="#173341" font-size="23" font-weight="650" text-anchor="start">决定下一步</text>
<text x="51" y="295" fill="#275697" font-size="17" font-weight="470" text-anchor="start">回复玩家，或提交目标</text>
<rect x="398" y="238" width="246" height="75" rx="12" fill="#ffffff" stroke="#c7d5d0" stroke-width="1.5"/>
<rect x="399" y="251" width="4" height="48" rx="2" fill="#00685d"/>
<text x="413" y="269" fill="#173341" font-size="23" font-weight="650" text-anchor="start">接收任务请求</text>
<text x="413" y="295" fill="#00685d" font-size="17" font-weight="470" text-anchor="start">建立或复用会话</text>
<path d="M 283 268 H 397" fill="none" stroke="#275697" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<text x="340" y="252" fill="#275697" font-size="17" font-weight="650" text-anchor="middle">请求</text>
<path d="M 397 302 H 283" fill="none" stroke="#00685d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)" stroke-dasharray="5 5"/>
<text x="340" y="328" fill="#00685d" font-size="16" font-weight="580" text-anchor="middle">受理回执</text>
<path d="M 120 239 V 226 H 71 V 237" fill="none" stroke="#275697" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
<path d="M 520 314 V 352" fill="none" stroke="#00685d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<rect x="398" y="355" width="246" height="75" rx="12" fill="#ffffff" stroke="#c7d5d0" stroke-width="1.5"/>
<rect x="399" y="368" width="4" height="48" rx="2" fill="#00685d"/>
<text x="413" y="386" fill="#173341" font-size="23" font-weight="650" text-anchor="start">运行工具循环</text>
<text x="413" y="412" fill="#00685d" font-size="17" font-weight="470" text-anchor="start">观察、选动作、读回执</text>
<path d="M 644 391 H 651 V 341 H 582 V 354" fill="none" stroke="#00685d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<path d="M 520 431 V 478" fill="none" stroke="#00685d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<rect x="398" y="480" width="246" height="75" rx="12" fill="#ffffff" stroke="#c7d5d0" stroke-width="1.5"/>
<rect x="399" y="493" width="4" height="48" rx="2" fill="#00685d"/>
<text x="413" y="511" fill="#173341" font-size="23" font-weight="650" text-anchor="start">生成目标报告</text>
<text x="413" y="537" fill="#00685d" font-size="17" font-weight="470" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GoalReportV2</text>
<rect x="36" y="480" width="246" height="75" rx="12" fill="#ffffff" stroke="#c7d5d0" stroke-width="1.5"/>
<rect x="37" y="493" width="4" height="48" rx="2" fill="#275697"/>
<text x="51" y="511" fill="#173341" font-size="23" font-weight="650" text-anchor="start">继续本次对话</text>
<text x="51" y="537" fill="#275697" font-size="17" font-weight="470" text-anchor="start">依据报告选择如何回复</text>
<path d="M 397 516 H 283" fill="none" stroke="#00685d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr-teal)"/>
<text x="340" y="497" fill="#00685d" font-size="17" font-weight="650" text-anchor="middle">结果</text>
<text x="40" y="580" fill="#275697" font-size="18" font-weight="450" text-anchor="start">主脑可处理后续消息</text>
<text x="403" y="580" fill="#00685d" font-size="18" font-weight="450" text-anchor="start">报告携带状态及证据引用</text>
<rect x="24" y="625" width="632" height="37" rx="7" fill="#edf0e9"/>
<text x="340" y="650" fill="#173341" font-size="19" font-weight="520" text-anchor="middle">受理回执说明已接单。交付是否完成，要等目标验真。</text>
</g></svg>
