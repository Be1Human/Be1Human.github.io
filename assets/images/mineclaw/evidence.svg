<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="fig-evidence-title fig-evidence-desc" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><title id="fig-evidence-title">同一份证据，三种明确结果</title><desc id="fig-evidence-desc">满足则完成，未满足则规划，未知则有界补充观察；同一份读数驱动进度与终态。</desc><rect x="28" y="150" width="280" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="29" y="151" width="5" height="144" rx="2" fill="#365fb8" stroke="#365fb8" stroke-width="1.2"/><text x="48" y="178" fill="#365fb8" font-size="18" font-weight="500" text-anchor="start">已有受限观察</text><text x="48" y="215" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">新鲜事实与正式目标</text><text x="48" y="246" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">精确物品 ID / 全部槽位</text><text x="48" y="273" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">不可用不等于数量 0</text><rect x="405" y="150" width="300" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="406" y="151" width="5" height="144" rx="2" fill="#147a6d" stroke="#147a6d" stroke-width="1.2"/><text x="425" y="178" fill="#147a6d" font-size="18" font-weight="500" text-anchor="start">F17 · 一份读数</text><text x="425" y="215" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">目标证据读取器</text><text x="425" y="246" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">同一结果供给 Guard</text><text x="425" y="273" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">同一结果供给 Verifier</text><path d="M308 223 L405 223" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="405,223 395.0,218.5 395.0,227.5" fill="#147a6d"/><path d="M705 223 L750 223" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M750 90 L750 378" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="802" y="28" width="290" height="116" rx="12" fill="#eaf6f1" stroke="#eaf6f1" stroke-width="1.2"/><text x="822" y="70" fill="#147a6d" font-size="24" font-weight="600" text-anchor="start">satisfied</text><text x="822" y="111" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">提交正式终态</text><path d="M750 90 L802 90" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="802,90 792.0,85.5 792.0,94.5" fill="#147a6d"/><rect x="802" y="172" width="290" height="116" rx="12" fill="#edf3ff" stroke="#edf3ff" stroke-width="1.2"/><text x="822" y="214" fill="#365fb8" font-size="24" font-weight="600" text-anchor="start">unsatisfied</text><text x="822" y="255" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">查询合法候选，继续规划</text><path d="M750 234 L802 234" fill="none" stroke="#365fb8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="802,234 792.0,229.5 792.0,238.5" fill="#365fb8"/><rect x="802" y="316" width="290" height="116" rx="12" fill="#fcf0ee" stroke="#fcf0ee" stroke-width="1.2"/><text x="822" y="358" fill="#ac4949" font-size="24" font-weight="600" text-anchor="start">unknown</text><text x="822" y="399" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">有界再观察，耗尽则退出</text><path d="M750 378 L802 378" fill="none" stroke="#ac4949" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="802,378 792.0,373.5 792.0,382.5" fill="#ac4949"/></svg>