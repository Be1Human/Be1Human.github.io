<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 910" role="img" aria-labelledby="fig-architecture-title fig-architecture-desc" style="font-family:PingFang SC,Microsoft YaHei,sans-serif"><title id="fig-architecture-title">从主人指令到真实动作的完整框架</title><desc id="fig-architecture-desc">目标固定方法和验真引用；绑定与准备产生句柄；执行前重验；Body 执行；同一目标证据反馈进度和终态。</desc><rect x="28" y="24" width="1064" height="68" rx="9" fill="#edf3ff" stroke="#edf3ff" stroke-width="1.2"/><text x="46" y="65.35" fill="#365fb8" font-size="21" font-weight="500" text-anchor="start">入口：主人聊天 → MainBrain 委派 → GoalAgent 观察与 GoalCompiler 编译</text><text x="28" y="140" fill="#172d49" font-size="21" font-weight="600" text-anchor="start">01   准备目标与方法</text><text x="1092" y="140" fill="#586b83" font-size="18" font-weight="400" text-anchor="end">固定 Generation / 同代引用 / schema 校验</text><rect x="28" y="170" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="29" y="171" width="5" height="144" rx="2" fill="#147a6d" stroke="#147a6d" stroke-width="1.2"/><text x="48" y="198" fill="#147a6d" font-size="18" font-weight="500" text-anchor="start">F15 · 显式合同</text><text x="48" y="235" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">正式 Goal v3</text><text x="48" y="266" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">判据 / 方法 / 验真引用</text><text x="48" y="293" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">真实 scope 与固定身份</text><rect x="405" y="170" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="406" y="171" width="5" height="144" rx="2" fill="#147a6d" stroke="#147a6d" stroke-width="1.2"/><text x="425" y="198" fill="#147a6d" font-size="18" font-weight="500" text-anchor="start">插件领域职责</text><text x="425" y="235" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">资源绑定 + 候选</text><text x="425" y="266" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">真实对象 / 完整参数</text><text x="425" y="293" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">事实引用 / 阶段前后置</text><rect x="782" y="170" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="783" y="171" width="5" height="144" rx="2" fill="#147a6d" stroke="#147a6d" stroke-width="1.2"/><text x="802" y="198" fill="#147a6d" font-size="18" font-weight="500" text-anchor="start">F16 · 准备后才 ready</text><text x="802" y="235" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">PreparedOperation</text><text x="802" y="266" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">编译程序 / hash / accesses</text><text x="802" y="293" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">完整校验后发出句柄</text><path d="M338 243 L405 243" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="405,243 395.0,238.5 395.0,247.5" fill="#147a6d"/><path d="M715 243 L782 243" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="782,243 772.0,238.5 772.0,247.5" fill="#147a6d"/><path d="M937 316 L937 400" fill="none" stroke="#365fb8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="937,400 941.5,390.0 932.5,390.0" fill="#365fb8"/><text x="960" y="365" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">选句柄</text><text x="28" y="370" fill="#172d49" font-size="21" font-weight="600" text-anchor="start">02   授权后执行</text><rect x="782" y="400" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="783" y="401" width="5" height="144" rx="2" fill="#147a6d" stroke="#147a6d" stroke-width="1.2"/><text x="802" y="428" fill="#147a6d" font-size="18" font-weight="500" text-anchor="start">GoalAgent + PlanAuthority</text><text x="802" y="465" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">执行前重验与授权</text><text x="802" y="496" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">校验对象 / 参数 / 事实版本</text><text x="802" y="523" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">依真实阶段验证效果与访问</text><rect x="405" y="400" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="406" y="401" width="5" height="144" rx="2" fill="#365fb8" stroke="#365fb8" stroke-width="1.2"/><text x="425" y="428" fill="#365fb8" font-size="18" font-weight="500" text-anchor="start">保留 · 身体执行通道</text><text x="425" y="465" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">唯一 Body Runtime</text><text x="425" y="496" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">既有 owner / signal / Atomic</text><text x="425" y="523" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">消费封存程序，维护 StopAck</text><rect x="28" y="400" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="29" y="401" width="5" height="144" rx="2" fill="#365fb8" stroke="#365fb8" stroke-width="1.2"/><text x="48" y="428" fill="#365fb8" font-size="18" font-weight="500" text-anchor="start">保留 · World / Ledger</text><text x="48" y="465" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">世界变化与操作账本</text><text x="48" y="496" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">真实副作用 + 操作回执</text><text x="48" y="523" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">回执不等于目标完成</text><path d="M782 473 L715 473" fill="none" stroke="#365fb8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="715,473 725.0,477.5 725.0,468.5" fill="#365fb8"/><path d="M405 473 L338 473" fill="none" stroke="#365fb8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="338,473 348.0,477.5 348.0,468.5" fill="#365fb8"/><path d="M28 510 L12 510 L12 703 L28 703" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="28,703 18.0,698.5 18.0,707.5" fill="#147a6d"/><text x="28" y="600" fill="#172d49" font-size="21" font-weight="600" text-anchor="start">03   用真实结果验收</text><rect x="28" y="630" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="29" y="631" width="5" height="144" rx="2" fill="#147a6d" stroke="#147a6d" stroke-width="1.2"/><text x="48" y="658" fill="#147a6d" font-size="18" font-weight="500" text-anchor="start">F17 · 一份目标证据</text><text x="48" y="695" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">GoalEvidenceReader</text><text x="48" y="726" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">按 evidencePlan 读取事实</text><text x="48" y="753" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">满足 / 未满足 / 未知</text><rect x="405" y="630" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="406" y="631" width="5" height="144" rx="2" fill="#365fb8" stroke="#365fb8" stroke-width="1.2"/><text x="425" y="658" fill="#365fb8" font-size="18" font-weight="500" text-anchor="start">Guard + Verifier</text><text x="425" y="695" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">进度与终态分别消费</text><text x="425" y="726" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">共享同一份证据</text><text x="425" y="753" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">保留预算 / epoch / CAS</text><rect x="782" y="630" width="310" height="146" rx="12" fill="#ffffff" stroke="#d7e1ed" stroke-width="1.2"/><rect x="783" y="631" width="5" height="144" rx="2" fill="#365fb8" stroke="#365fb8" stroke-width="1.2"/><text x="802" y="658" fill="#365fb8" font-size="18" font-weight="500" text-anchor="start">复用现有工具循环</text><text x="802" y="695" fill="#172d49" font-size="24" font-weight="600" text-anchor="start">GoalAgent 决定后续</text><text x="802" y="726" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">完成 / 再观察 / 调整 / 退出</text><text x="802" y="753" fill="#586b83" font-size="19" font-weight="400" text-anchor="start">不新增第二个调度器</text><path d="M338 703 L405 703" fill="none" stroke="#147a6d" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="405,703 395.0,698.5 395.0,707.5" fill="#147a6d"/><path d="M715 703 L782 703" fill="none" stroke="#365fb8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><polygon points="782,703 772.0,698.5 772.0,707.5" fill="#365fb8"/><rect x="28" y="824" width="1064" height="58" rx="9" fill="#edf3ff" stroke="#edf3ff" stroke-width="1.2"/><text x="46" y="860.0" fill="#365fb8" font-size="20" font-weight="500" text-anchor="start">未满足 → 再观察与准备     已满足 → 提交终态     未知 → 有界补充观察</text></svg>