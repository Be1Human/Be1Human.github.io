<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Supervisor、Verify 与 Eval</title><desc id="desc">同一任务的三种职责：调度方向、验证条件、衡量表现。本站原创教学结构图。</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#233e4c" fill="none" stroke-width=".6"/></pattern><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#8bccce" stroke-width="1.3"/></marker></defs><path d="M0 0h1200v675H0z" fill="#10232e"/><path d="M0 0h1200v675H0z" fill="url(#g)"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="72" y="84" fill="#8bccce" font-size="14" letter-spacing="3">AGENT LEARNING / CONCEPT COMPARISON</text><text x="72" y="158" fill="#e9dfcd" font-size="43" font-weight="650">调度、验证与评测</text><text x="74" y="202" fill="#a5b6ba" font-size="18">一个任务，三种职责。</text><g fill="#183440" stroke="#395766" stroke-width="1.5"><rect x="72" y="264" width="320" height="234" rx="10"/><rect x="440" y="264" width="320" height="234" rx="10"/><rect x="808" y="264" width="320" height="234" rx="10"/></g><g fill="none" stroke-width="2"><path d="M93 264h279" stroke="#ff918b"/><path d="M461 264h279" stroke="#8bccce"/><path d="M829 264h279" stroke="#b39acb"/></g><g font-size="13" letter-spacing="1"><text x="98" y="304" fill="#ff918b">01 / SUPERVISOR</text><text x="466" y="304" fill="#8bccce">02 / VERIFY</text><text x="834" y="304" fill="#b39acb">03 / EVAL</text></g><g font-size="28" fill="#e9dfcd" font-weight="600"><text x="98" y="359">决定下一步</text><text x="466" y="359">检查当前条件</text><text x="834" y="359">提供质量证据</text></g><g font-size="17" fill="#a5b6ba"><text x="98" y="404">选择节点 / 分派任务</text><text x="98" y="439">继续 · 重试 · 停止</text><text x="466" y="404">类型 / 事实 / 权限</text><text x="466" y="439">通过 · 失败 · 未知</text><text x="834" y="404">样本 / 评分 / 汇总</text><text x="834" y="439">离线或在线</text></g><path d="M232 520v42H968v-42" stroke="#587e89" fill="none" stroke-dasharray="6 6" marker-end="url(#a)"/><rect x="416" y="545" width="369" height="32" rx="8" fill="#10232e"/><text x="440" y="567" fill="#8bccce" font-size="16">评测证据 → 改进规则与控制策略</text><text x="74" y="626" fill="#819ba5" font-size="12" letter-spacing="1">CLOUD BOY / 原创教学示意，非系统运行截图</text></g></svg>
