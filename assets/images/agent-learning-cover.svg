<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">同一任务的三个观察角度</title><desc id="desc">同一任务分别观察证据怎样改变行动、运行状态与故障恢复、判据和重复运行结果。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker></defs><rect width="1200" height="590" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="65" fill="#e9dfcd" font-size="32" font-weight="650">同一条任务链，从三个角度读</text><text x="48" y="105" fill="#a5b6ba" font-size="20">“比较两份版本文档，给出带引用的结论”</text><g fill="#193441" stroke="#4c6776"><rect x="48" y="156" width="1104" height="108" rx="8"/><rect x="48" y="300" width="1104" height="108" rx="8"/><rect x="48" y="444" width="1104" height="108" rx="8"/></g><g font-size="24" font-weight="600"><text x="75" y="199" fill="#ffaaa3">ReAct · 证据与行动</text><text x="75" y="343" fill="#8bccce">Loop · 状态与恢复</text><text x="75" y="487" fill="#c9b0e4">Eval · 判据与重复结果</text></g><g fill="#e9dfcd" font-size="23"><text x="385" y="199">读旧版 → 观察缺口 → 再读新版</text><text x="385" y="343">保存状态 / 执行工具 / 超时恢复 / 结束</text><text x="385" y="487">固定任务与预算 → 重复运行 → 按判据评分</text></g><g fill="#a5b6ba" font-size="19"><text x="385" y="237">关注：证据怎样改变下一次行动。</text><text x="385" y="381">关注：状态怎样保存，故障之后怎样恢复。</text><text x="385" y="525">关注：怎样用重复结果判断改动的影响。</text></g></g></svg>