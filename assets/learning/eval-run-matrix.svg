<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">12次运行，三个读数</title><desc id="desc">四项教学任务各运行三次。通过九次；四项都至少通过一次，两项三次全部通过。</desc><rect width="1200" height="650" rx="14" fill="#132b38"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="55" y="65" font-size="34" fill="#f1e8d8" font-weight="650" text-anchor="start">12 次运行，三个不同的读数</text><text x="55" y="104" font-size="19" fill="#c6d5d7" font-weight="400" text-anchor="start">教学数据 · 每行同一任务，环境重置后运行三次</text><text x="55" y="170" font-size="19" fill="#8bccce" font-weight="400" text-anchor="start">任务</text><text x="410" y="170" font-size="19" fill="#8bccce" font-weight="400" text-anchor="middle">第 1 次</text><text x="555" y="170" font-size="19" fill="#8bccce" font-weight="400" text-anchor="middle">第 2 次</text><text x="700" y="170" font-size="19" fill="#8bccce" font-weight="400" text-anchor="middle">第 3 次</text><rect x="42" y="188" width="735" height="61" rx="8" fill="#173340" stroke="#2d4a59"/><text x="58" y="226" font-size="21" fill="#c6d5d7" font-weight="400" text-anchor="start">T1 正常更新</text><circle cx="410" cy="220" r="22" fill="#244e47"/><text x="410" y="227" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><circle cx="555" cy="220" r="22" fill="#244e47"/><text x="555" y="227" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><circle cx="700" cy="220" r="22" fill="#244e47"/><text x="700" y="227" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><rect x="42" y="266" width="735" height="61" rx="8" fill="#173340" stroke="#2d4a59"/><text x="58" y="304" font-size="21" fill="#c6d5d7" font-weight="400" text-anchor="start">T2 缺资料：准确报告</text><circle cx="410" cy="298" r="22" fill="#244e47"/><text x="410" y="305" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><circle cx="555" cy="298" r="22" fill="#244e47"/><text x="555" y="305" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><circle cx="700" cy="298" r="22" fill="#244e47"/><text x="700" y="305" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><rect x="42" y="344" width="735" height="61" rx="8" fill="#173340" stroke="#2d4a59"/><text x="58" y="382" font-size="21" fill="#c6d5d7" font-weight="400" text-anchor="start">T3 版本冲突</text><circle cx="410" cy="376" r="22" fill="#244e47"/><text x="410" y="383" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><circle cx="555" cy="376" r="22" fill="#573d46"/><text x="555" y="383" font-size="27" fill="#ffb0aa" font-weight="650" text-anchor="middle">×</text><circle cx="700" cy="376" r="22" fill="#244e47"/><text x="700" y="383" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><rect x="42" y="422" width="735" height="61" rx="8" fill="#173340" stroke="#2d4a59"/><text x="58" y="460" font-size="21" fill="#c6d5d7" font-weight="400" text-anchor="start">T4 暂时超时</text><circle cx="410" cy="454" r="22" fill="#573d46"/><text x="410" y="461" font-size="27" fill="#ffb0aa" font-weight="650" text-anchor="middle">×</text><circle cx="555" cy="454" r="22" fill="#244e47"/><text x="555" y="461" font-size="27" fill="#99e0c2" font-weight="650" text-anchor="middle">✓</text><circle cx="700" cy="454" r="22" fill="#573d46"/><text x="700" y="461" font-size="27" fill="#ffb0aa" font-weight="650" text-anchor="middle">×</text><text x="860" y="226" font-size="45" fill="#f1e8d8" font-weight="650" text-anchor="start">9 / 12</text><text x="860" y="261" font-size="19" fill="#c6d5d7" font-weight="400" text-anchor="start">运行通过率</text><text x="860" y="347" font-size="45" fill="#f1e8d8" font-weight="650" text-anchor="start">4 / 4</text><text x="860" y="382" font-size="19" fill="#c6d5d7" font-weight="400" text-anchor="start">至少一次通过的任务</text><text x="860" y="468" font-size="45" fill="#f1e8d8" font-weight="650" text-anchor="start">2 / 4</text><text x="860" y="503" font-size="19" fill="#c6d5d7" font-weight="400" text-anchor="start">三次全部通过的任务</text><text x="55" y="589" font-size="19" fill="#8bccce" font-weight="400" text-anchor="start">T2 的成功条件是“不写入，并准确说明资料不足”。</text><text x="55" y="620" font-size="17" fill="#9bb0b8" font-weight="400" text-anchor="start">本图用于解释统计口径，不是任何论文的实验成绩。</text></g></svg>