<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">三种职责的执行泳道</title><desc id="desc">Supervisor在当前执行控制线上选择检索和修订，Verify在工具前和交付前设门控，Eval从轨迹旁路采样形成逐项评分和回归集。</desc><defs><marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#ff918b" stroke-width="1.5"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a6d49f" stroke-width="1.5"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#b39acb" stroke-width="1.5"/></marker></defs><rect width="1200" height="1070" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="50" y="58" fill="#e9dfcd" font-size="32" font-weight="650"><tspan x="50" dy="0">同一份工单草稿：谁选下一步，谁检查，谁统计</tspan></text><text x="50" y="102" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="50" dy="0">实线是当前请求的控制流；虚线是测量支路。教学系统只生成草稿，不提交工单。</tspan></text><rect x="30" y="140" width="1140" height="165" rx="8" fill="#183541"/><text x="50" y="180" fill="#b39acb" font-size="22" font-weight="650"><tspan x="50" dy="0">Supervisor</tspan></text><rect x="30" y="340" width="1140" height="165" rx="8" fill="#183541"/><text x="50" y="380" fill="#8bccce" font-size="22" font-weight="650"><tspan x="50" dy="0">Verify / Gate</tspan></text><rect x="30" y="540" width="1140" height="165" rx="8" fill="#183541"/><text x="50" y="580" fill="#a6d49f" font-size="22" font-weight="650"><tspan x="50" dy="0">工具与候选</tspan></text><rect x="30" y="760" width="1140" height="165" rx="8" fill="#183541"/><text x="50" y="800" fill="#ff918b" font-size="22" font-weight="650"><tspan x="50" dy="0">Eval / Dataset</tspan></text><rect x="280" y="165" width="255" height="90" rx="10" fill="#183541" stroke="#b39acb" stroke-width="2"/><text x="302" y="205" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="302" dy="0">选择检索</tspan></text><path d="M550 210 L680 210" fill="none" stroke="#b39acb" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="700" y="165" width="290" height="90" rx="10" fill="#183541" stroke="#b39acb" stroke-width="2"/><text x="722" y="205" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="722" dy="0">根据失败决定修订</tspan></text><rect x="280" y="365" width="255" height="100" rx="10" fill="#183541" stroke="#8bccce" stroke-width="2"/><text x="302" y="405" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="302" dy="0">工具前：检查授权</tspan></text><rect x="700" y="365" width="290" height="100" rx="10" fill="#183541" stroke="#8bccce" stroke-width="2"/><text x="722" y="405" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="722" dy="0">交付前：逐项校验</tspan></text><path d="M405 270 L405 345" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><path d="M845 345 L845 270" fill="none" stroke="#b39acb" stroke-width="3" marker-end="url(#arrow-purple)"/><text x="1000" y="413" fill="#8bccce" font-size="20" font-weight="400"><tspan x="1000" dy="0">pass → 交付</tspan><tspan x="1000" dy="31.0">fail → 修订</tspan><tspan x="1000" dy="31.0">unknown → 补证据</tspan></text><rect x="280" y="565" width="255" height="100" rx="10" fill="#183541" stroke="#a6d49f" stroke-width="2"/><text x="302" y="605" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="302" dy="0">读 D24 默认配置</tspan></text><rect x="700" y="565" width="290" height="100" rx="10" fill="#183541" stroke="#a6d49f" stroke-width="2"/><text x="722" y="605" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="722" dy="0">候选草稿 v1</tspan><tspan x="722" dy="35.65">引用错指 D23</tspan></text><path d="M405 480 L405 545" fill="none" stroke="#a6d49f" stroke-width="3" marker-end="url(#arrow-green)"/><path d="M550 615 L680 615" fill="none" stroke="#a6d49f" stroke-width="3" marker-end="url(#arrow-green)"/><path d="M845 545 L845 485" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><path d="M600 615 V790 H350" fill="none" stroke="#ff918b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/><rect x="280" y="805" width="390" height="100" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="302" y="845" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="302" dy="0">保留输入、轨迹、候选、判据</tspan><tspan x="302" dy="35.65">离线回归 / 在线抽样</tspan></text><path d="M685 855 L750 855" fill="none" stroke="#ff918b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/><rect x="770" y="805" width="350" height="100" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="792" y="845" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="792" dy="0">grader 输出逐项反馈</tspan><tspan x="792" dy="35.65">汇总漏检、耗时、成本</tspan></text><text x="50" y="985" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="50" dy="0">Eval 若被放进“是否交付”的同步条件，它也承担 Gate；是否阻塞用户应单独标注。</tspan></text><text x="50" y="1030" fill="#a5b6ba" font-size="20" font-weight="400"><tspan x="50" dy="0">原创职责泳道图。权限检查在工具调用前；事后评分无法撤回已经发生的读取。</tspan></text></g></svg>