<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">导出故障的上下文装配对比</title><desc id="desc">左侧将旧手册和全部日志混在一起，右侧按时间线选择当前版本的四条证据，并保留ACK原因未知。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="48" y="58" fill="#e9dfcd" font-size="32" font-weight="650" text-anchor="start">同一故障，两种上下文</text><text x="48" y="96" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">教学数据：导出 E17 被两个 Worker 重复执行</text><rect x="48" y="134" width="500" height="480" rx="10" fill="#173341" stroke="#ff9c95" stroke-width="2"/><rect x="652" y="134" width="500" height="480" rx="10" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="74" y="176" fill="#ff9c95" font-size="25" font-weight="600" text-anchor="start">全量堆入</text><text x="678" y="176" fill="#8bccce" font-size="25" font-weight="600" text-anchor="start">按当前问题装配</text><rect x="74" y="210" width="448" height="48" rx="5" fill="#142a36" stroke="#3d5b69" stroke-width="2"/><text x="90" y="241" fill="#ff9c95" font-size="20" font-weight="400" text-anchor="start">v1：完成后自动确认</text><rect x="74" y="275" width="448" height="48" rx="5" fill="#142a36" stroke="#3d5b69" stroke-width="2"/><text x="90" y="306" fill="#e9dfcd" font-size="20" font-weight="400" text-anchor="start">v2：写文件后手动 ACK</text><rect x="74" y="340" width="448" height="48" rx="5" fill="#142a36" stroke="#3d5b69" stroke-width="2"/><text x="90" y="371" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">完整日志：多次重复心跳</text><rect x="74" y="405" width="448" height="48" rx="5" fill="#142a36" stroke="#3d5b69" stroke-width="2"/><text x="90" y="436" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">历史讨论：调整过重试</text><rect x="74" y="470" width="448" height="48" rx="5" fill="#142a36" stroke="#3d5b69" stroke-width="2"/><text x="90" y="501" fill="#ff9c95" font-size="20" font-weight="400" text-anchor="start">旧回答：可能是用户点了两次</text><text x="74" y="584" fill="#a9bfc6" font-size="19" font-weight="400" text-anchor="start">相似材料互相竞争，版本混在一起</text><circle cx="699" cy="218" r="6" fill="#8bccce"/><text x="719" y="225" fill="#8bccce" font-size="19" font-weight="400" text-anchor="start">10:00:00</text><text x="844" y="225" fill="#e9dfcd" font-size="20" font-weight="400" text-anchor="start">A 开始执行 E17</text><path d="M699 226 V283" fill="none" stroke="#3d5b69" stroke-width="2.3"/><circle cx="699" cy="292" r="6" fill="#8bccce"/><text x="719" y="299" fill="#8bccce" font-size="19" font-weight="400" text-anchor="start">10:00:08</text><text x="844" y="299" fill="#e9dfcd" font-size="20" font-weight="400" text-anchor="start">A 已写出文件</text><path d="M699 300 V357" fill="none" stroke="#3d5b69" stroke-width="2.3"/><circle cx="699" cy="366" r="6" fill="#8bccce"/><text x="719" y="373" fill="#8bccce" font-size="19" font-weight="400" text-anchor="start">10:00:10</text><text x="844" y="373" fill="#e9dfcd" font-size="20" font-weight="400" text-anchor="start">ACK 超时，任务重投</text><path d="M699 374 V431" fill="none" stroke="#3d5b69" stroke-width="2.3"/><circle cx="699" cy="440" r="6" fill="#8bccce"/><text x="719" y="447" fill="#8bccce" font-size="19" font-weight="400" text-anchor="start">10:00:11</text><text x="844" y="447" fill="#e9dfcd" font-size="20" font-weight="400" text-anchor="start">B 再次执行 E17</text><rect x="678" y="524" width="448" height="66" rx="5" fill="#243245" stroke="#bea7dd" stroke-width="2"/><text x="694" y="549" fill="#bea7dd" font-size="19" font-weight="400" text-anchor="start">仍未知：ACK 为什么没有成功？</text><text x="694" y="576" fill="#a9bfc6" font-size="18" font-weight="400" text-anchor="start">下一次只读取 ACK 错误与版本配置</text><path d="M568 362 H630" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="48" y="672" fill="#8bccce" font-size="23" font-weight="400" text-anchor="start">上下文保留：目标 + 已证事实 + 证据位置 + 未解问题</text><text x="48" y="716" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">原始日志留在外部；摘要中的每项事实都能回到记录。</text></g></svg>