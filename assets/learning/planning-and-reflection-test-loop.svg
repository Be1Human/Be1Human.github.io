<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">CSV修复中的证据反馈环</title><desc id="desc">错误的split实现产生三列，失败测试定位引号内逗号。修订使用解析器后再次运行原失败样本与回归样本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="48" y="58" fill="#e9dfcd" font-size="32" font-weight="650" text-anchor="start">反思应改变下一次补丁</text><text x="48" y="96" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">教学任务：CSV 姓名与年龄应读成两列</text><rect x="48" y="142" width="510" height="182" rx="10" fill="#173341" stroke="#ff9c95" stroke-width="2"/><text x="72" y="182" fill="#ff9c95" font-size="23" font-weight="600" text-anchor="start">第一次实现</text><text x="72" y="229" fill="#e9dfcd" font-size="25" font-weight="400" text-anchor="start">line.split(&quot;,&quot;)</text><text x="72" y="275" fill="#a9bfc6" font-size="23" font-weight="400" text-anchor="start">输入：&quot;Lee, Ann&quot;,29</text><rect x="650" y="142" width="502" height="182" rx="10" fill="#173341" stroke="#bea7dd" stroke-width="2"/><text x="674" y="182" fill="#bea7dd" font-size="23" font-weight="600" text-anchor="start">测试反馈</text><text x="674" y="229" fill="#e9dfcd" font-size="24" font-weight="400" text-anchor="start">expected 2 columns</text><text x="674" y="275" fill="#ff9c95" font-size="24" font-weight="400" text-anchor="start">received 3 columns</text><path d="M568 234 H630" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M901 334 V383" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="650" y="400" width="502" height="212" rx="10" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="674" y="442" fill="#8bccce" font-size="23" font-weight="600" text-anchor="start">可检验的修订</text><text x="674" y="488" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">假设：引号内逗号被当成分隔符</text><text x="674" y="531" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">动作：使用 CSV 解析器</text><text x="674" y="574" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">保留反例：嵌入逗号、引号、换行</text><path d="M638 508 H582 V437 H531" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="48" y="400" width="510" height="212" rx="10" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="72" y="442" fill="#8bccce" font-size="23" font-weight="600" text-anchor="start">重新运行</text><text x="72" y="488" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">同一失败样本 → 通过</text><text x="72" y="532" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">普通行 / 转义 / 空字段 → 通过</text><text x="72" y="576" fill="#a9bfc6" font-size="21" font-weight="400" text-anchor="start">未覆盖的方言 → 仍不作保证</text><path d="M303 622 V676 H370" fill="none" stroke="#bea7dd" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="380" y="646" width="742" height="74" rx="8" fill="#243245" stroke="#bea7dd"/><text x="404" y="690" fill="#bea7dd" font-size="22">经验记忆：触发条件 + 失败样本 + 已验证范围</text></g></svg>