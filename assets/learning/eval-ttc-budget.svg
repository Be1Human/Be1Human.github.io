<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">同一预算怎样分配</title><desc id="desc">八个示意额度单位可分配给并行候选与测试，也可分配给生成、修订和复测。</desc><rect width="1200" height="620" rx="14" fill="#132b38"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="55" y="65" font-size="34" fill="#f1e8d8" font-weight="650" text-anchor="start">预算相同，执行策略可以不同</text><text x="55" y="104" font-size="19" fill="#c6d5d7" font-weight="400" text-anchor="start">8 个示意额度单位；每一格都是需要计入总账的工作。</text><text x="55" y="212" font-size="25" fill="#8bccce" font-weight="600" text-anchor="start">并行探索</text><text x="55" y="250" font-size="17" fill="#c6d5d7" font-weight="400" text-anchor="start">4 份候选，逐份测试</text><rect x="277" y="173" width="91" height="91" rx="8" fill="#244958" stroke="#45616d"/><text x="322" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">生成A</text><rect x="378" y="173" width="91" height="91" rx="8" fill="#35485b" stroke="#45616d"/><text x="423" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">测试A</text><rect x="479" y="173" width="91" height="91" rx="8" fill="#244958" stroke="#45616d"/><text x="524" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">生成B</text><rect x="580" y="173" width="91" height="91" rx="8" fill="#35485b" stroke="#45616d"/><text x="625" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">测试B</text><rect x="681" y="173" width="91" height="91" rx="8" fill="#244958" stroke="#45616d"/><text x="726" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">生成C</text><rect x="782" y="173" width="91" height="91" rx="8" fill="#35485b" stroke="#45616d"/><text x="827" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">测试C</text><rect x="883" y="173" width="91" height="91" rx="8" fill="#244958" stroke="#45616d"/><text x="928" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">生成D</text><rect x="984" y="173" width="91" height="91" rx="8" fill="#35485b" stroke="#45616d"/><text x="1029" y="226" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">测试D</text><text x="55" y="375" font-size="25" fill="#ffb0aa" font-weight="600" text-anchor="start">顺序修订</text><text x="55" y="413" font-size="17" fill="#c6d5d7" font-weight="400" text-anchor="start">失败反馈改变下一次生成</text><rect x="277" y="337" width="192" height="91" rx="8" fill="#244958" stroke="#45616d"/><text x="373.0" y="390" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">生成 A</text><rect x="479" y="337" width="91" height="91" rx="8" fill="#35485b" stroke="#45616d"/><text x="524.5" y="390" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">测试</text><rect x="580" y="337" width="192" height="91" rx="8" fill="#5b4148" stroke="#45616d"/><text x="676.0" y="390" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">据失败修订</text><rect x="782" y="337" width="91" height="91" rx="8" fill="#35485b" stroke="#45616d"/><text x="827.5" y="390" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">复测</text><rect x="883" y="337" width="192" height="91" rx="8" fill="#1b303d" stroke="#45616d"/><text x="979.0" y="390" font-size="18" fill="#e2e9e5" font-weight="400" text-anchor="middle">余量 / 早停</text><text x="55" y="501" font-size="21" fill="#c6d5d7" font-weight="400" text-anchor="start">哪条更好，取决于：初始候选有没有方向、反馈能否定位错误、测试能否选对。</text><text x="55" y="554" font-size="18" fill="#9bb0b8" font-weight="400" text-anchor="start">“额度”仅用于示意策略，不等同于 token、FLOPs 或秒，也不代表实验准确率。</text></g></svg>