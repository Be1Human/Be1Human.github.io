<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1035" viewBox="0 0 1200 1035" role="img" aria-labelledby="title desc"><title id="title">ReAct版本核查案例</title><desc id="desc">对比直接作答、只取首条检索和检查版本后补查的轨迹。只有最后一条读取了2.4发布包默认配置并把8000毫秒换算成8秒。</desc><defs><marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#ff918b" stroke-width="1.5"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a6d49f" stroke-width="1.5"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#b39acb" stroke-width="1.5"/></marker></defs><rect width="1200" height="1035" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="50" y="58" fill="#e9dfcd" font-size="32" font-weight="650"><tspan x="50" dy="0">同一个版本问题，证据怎样改变答案</tspan></text><text x="50" y="102" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="50" dy="0">教学材料：2.3 指南默认 5 秒；2.4 发布包默认配置 8000 毫秒</tspan></text><text x="50" y="163" fill="#8bccce" font-size="25" font-weight="600"><tspan x="50" dy="0">用户：2.4 版导入超时，默认是 5 秒还是 8 秒？（无用户覆盖）</tspan></text><rect x="50" y="205" width="210" height="150" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="72" y="245" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="72" dy="0">直接作答</tspan><tspan x="72" dy="37.2">只用已有记忆</tspan></text><path d="M275 278 L355 278" fill="none" stroke="#ff918b" stroke-width="3" marker-end="url(#arrow-red)"/><rect x="375" y="205" width="755" height="150" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="397" y="245" fill="#e9dfcd" font-size="26" font-weight="400"><tspan x="397" dy="0">记忆里出现“5 秒”</tspan><tspan x="397" dy="40.300000000000004">没有版本证据 → 回答错误</tspan></text><rect x="50" y="395" width="210" height="170" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="72" y="435" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="72" dy="0">只取首条</tspan><tspan x="72" dy="37.2">检索到了资料</tspan></text><path d="M275 480 L355 480" fill="none" stroke="#ff918b" stroke-width="3" marker-end="url(#arrow-red)"/><rect x="375" y="395" width="755" height="170" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="397" y="435" fill="#e9dfcd" font-size="26" font-weight="400"><tspan x="397" dy="0">搜索命中 guide-2.3：5 秒</tspan><tspan x="397" dy="40.300000000000004">来源存在，但版本不匹配 → 仍回答错误</tspan></text><rect x="50" y="610" width="210" height="290" rx="10" fill="#183541" stroke="#8bccce" stroke-width="2"/><text x="72" y="650" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="72" dy="0">ReAct 示例</tspan><tspan x="72" dy="37.2">检查观察结果</tspan><tspan x="72" dy="37.2">再选择行动</tspan></text><rect x="300" y="610" width="380" height="130" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="322" y="650" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="322" dy="0">读 guide-2.3</tspan><tspan x="322" dy="38.75">发现：版本不匹配</tspan></text><path d="M700 675 L760 675" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><rect x="780" y="610" width="350" height="130" rx="10" fill="#183541" stroke="#8bccce" stroke-width="2"/><text x="802" y="650" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="802" dy="0">读 2.4 默认配置</tspan><tspan x="802" dy="38.75">观察：8000 ms</tspan></text><path d="M955 755 V800 H680" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><rect x="300" y="785" width="350" height="115" rx="10" fill="#183541" stroke="#a6d49f" stroke-width="2"/><text x="322" y="825" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="322" dy="0">单位换算：8 秒</tspan><tspan x="322" dy="38.75">附发布包默认来源</tspan></text><text x="50" y="955" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="50" dy="0">关键变化发生在“读到旧版本”之后：下一步从回答改为补查。</tspan></text><text x="50" y="995" fill="#a5b6ba" font-size="19" font-weight="400"><tspan x="50" dy="0">原创教学图；参照 ReAct 的交错决策与环境反馈机制，不是论文成绩复现。</tspan></text></g></svg>