   <text style="font-size: 19px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #8bccce" x="86.4" y="466.56" transform="rotate(-0 86.4 466.56)">z = a* [1,0] + (1 − a*) [0,1]</text>
  </g>
  <g id="text_31">
   <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #a5b6ba" x="86.4" y="497.664" transform="rotate(-0 86.4 497.664)">背景 V 在本例中同向，所以可合并；一般情形要逐项计算 Σ a[j]v[j]。</text>
  </g>
 </g>
