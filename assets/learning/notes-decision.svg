<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">一条分类请求的三层结果</title><desc id="desc">同一条新闻先定义标签，再获得模型输出，最后由代码执行发布或复核；两组三维教学分布按开发工具、游戏、硬件排列，硬件概率设为零。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="64" fill="#e9dfcd" font-size="31" font-weight="650">新闻分类：把标签和发布决定分开</text><text x="48" y="104" fill="#a5b6ba" font-size="20">教学分布：硬件概率设为 0；用于比较形状，不是 API 实测。</text><rect x="48" y="147" width="1104" height="90" rx="8" fill="#1a3442" stroke="#4e6875"/><text x="72" y="184" fill="#8bccce" font-size="20">允许使用的证据</text><text x="72" y="218" fill="#e9dfcd" font-size="23">“Minecraft 伙伴新增目标执行与日志控制台” → 开发工具 / 游戏 / 硬件</text><path d="M600 249v36" stroke="#8bccce" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="300" width="525" height="148" rx="8" fill="#172e3b" stroke="#6e8e9b"/><rect x="627" y="300" width="525" height="148" rx="8" fill="#172e3b" stroke="#6e8e9b"/><text x="74" y="341" fill="#b39acb" font-size="20">输出 A · 有分歧</text><text x="653" y="341" fill="#8bccce" font-size="20">输出 B · 更集中</text><text x="74" y="386" fill="#e9dfcd" font-size="22">开发工具 0.51　游戏 0.49　硬件 0</text><text x="653" y="386" fill="#e9dfcd" font-size="22">开发工具 0.99　游戏 0.01　硬件 0</text><text x="74" y="422" fill="#a5b6ba" font-size="21">最高标签相同，两个主要候选接近。</text><text x="653" y="422" fill="#a5b6ba" font-size="21">分布更集中，仍需标注集检验。</text><path d="M311 460v35h578v-35" stroke="#779aa7" stroke-width="2" fill="none"/><text x="48" y="550" fill="#ffaaa3" font-size="24">代码策略：标签规则 + 权限 + 复核条件 → 发布或暂存</text><text x="48" y="589" fill="#a5b6ba" font-size="19">分类结果不是发布授权；单条高概率也不能证明校准。</text></g></svg>