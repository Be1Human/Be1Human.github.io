<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Agent Loop中断与恢复</title><desc id="desc">展示写文件后但保存观察前的中断窗口，以及恢复时先核对执行账本与文件哈希再继续测试，避免重复副作用。</desc><defs><marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#ff918b" stroke-width="1.5"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a6d49f" stroke-width="1.5"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#b39acb" stroke-width="1.5"/></marker></defs><rect width="1200" height="1050" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="50" y="58" fill="#e9dfcd" font-size="32" font-weight="650"><tspan x="50" dy="0">进程重启后，从哪一步继续？</tspan></text><text x="50" y="102" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="50" dy="0">案例：修正空字符串解析；文件已写入，但工具结果尚未持久化时进程中断</tspan></text><text x="50" y="170" fill="#8bccce" font-size="24" font-weight="650"><tspan x="50" dy="0">正常控制环</tspan></text><rect x="50" y="205" width="260" height="140" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="72" y="245" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="72" dy="0">模型提出修改</tspan><tspan x="72" dy="38.75">call_id = edit-17</tspan></text><path d="M325 275 L390 275" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><rect x="410" y="205" width="310" height="140" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="432" y="245" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="432" dy="0">宿主执行写文件</tspan><tspan x="432" dy="38.75">落盘后计算新 hash</tspan></text><path d="M735 275 L800 275" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><rect x="820" y="205" width="330" height="140" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="842" y="245" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="842" dy="0">保存工具结果</tspan><tspan x="842" dy="38.75">再组装下一轮上下文</tspan></text><path d="M980 365 V415 H180 V365" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><text x="400" y="452" fill="#8bccce" font-size="22" font-weight="400"><tspan x="400" dy="0">观察结果回到下一次决策</tspan></text><path d="M565 365 V520" fill="none" stroke="#ff918b" stroke-width="3" marker-end="url(#arrow-red)"/><text x="600" y="493" fill="#ff918b" font-size="25" font-weight="650"><tspan x="600" dy="0">中断窗口</tspan></text><rect x="50" y="550" width="510" height="170" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="72" y="590" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="72" dy="0">检查点只记录 waiting_tool</tspan><tspan x="72" dy="38.75">但磁盘里的文件可能已经改变</tspan><tspan x="72" dy="38.75">“没收到结果”无法证明“没执行”</tspan></text><rect x="640" y="550" width="510" height="170" rx="10" fill="#183541" stroke="#b39acb" stroke-width="2"/><text x="662" y="590" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="662" dy="0">恢复时核对执行账本与文件 hash</tspan><tspan x="662" dy="38.75">匹配：补记并清除 pending</tspan><tspan x="662" dy="38.75">无法判定：保留 unknown</tspan></text><path d="M575 635 L625 635" fill="none" stroke="#b39acb" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="50" y="770" width="510" height="125" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="72" y="810" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="72" dy="0">旧实现：空输入得到 [&quot;&quot;]</tspan><tspan x="72" dy="38.75">演示测试：1 / 2 通过</tspan></text><rect x="640" y="770" width="510" height="125" rx="10" fill="#183541" stroke="#a6d49f" stroke-width="2"/><text x="662" y="810" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="662" dy="0">恢复后运行两条 fixture</tspan><tspan x="662" dy="38.75">修复结果：2 / 2 通过</tspan></text><path d="M575 832 L625 832" fill="none" stroke="#a6d49f" stroke-width="3" marker-end="url(#arrow-green)"/><text x="50" y="965" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="50" dy="0">持久化状态帮助恢复；副作用是否可重放，仍取决于工具语义和执行证据。</tspan></text><text x="50" y="1010" fill="#a5b6ba" font-size="19" font-weight="400"><tspan x="50" dy="0">原创恢复示意；两条 fixture 已实际运行，仅验证示例函数，不代表 Agent 成功率。</tspan></text></g></svg>