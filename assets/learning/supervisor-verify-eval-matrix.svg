<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">门控校验的漏检与误拦矩阵</title><desc id="desc">20份教学草稿按人工标签和校验器结果分成12正确放行2漏检1误拦5正确拦截，分别给出不同分母。</desc><defs><marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#ff918b" stroke-width="1.5"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a6d49f" stroke-width="1.5"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#b39acb" stroke-width="1.5"/></marker></defs><rect width="1200" height="940" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="50" y="58" fill="#e9dfcd" font-size="32" font-weight="650"><tspan x="50" dy="0">同一次检查，可以决定是否放行，也可以留下统计数据</tspan></text><text x="50" y="102" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="50" dy="0">假设人工复核 20 份草稿；以下数字只用于讲清分母，不是实际评测成绩</tspan></text><text x="360" y="220" fill="#a6d49f" font-size="25" font-weight="650"><tspan x="360" dy="0">人工：引用成立</tspan></text><text x="770" y="220" fill="#ff918b" font-size="25" font-weight="650"><tspan x="770" dy="0">人工：引用不成立</tspan></text><text x="50" y="350" fill="#8bccce" font-size="25" font-weight="650"><tspan x="50" dy="0">校验器</tspan><tspan x="50" dy="38.75">放行</tspan></text><text x="50" y="580" fill="#8bccce" font-size="25" font-weight="650"><tspan x="50" dy="0">校验器</tspan><tspan x="50" dy="38.75">拦截</tspan></text><rect x="310" y="270" width="370" height="170" rx="10" fill="#183541" stroke="#a6d49f" stroke-width="2"/><text x="332" y="310" fill="#e9dfcd" font-size="27" font-weight="400"><tspan x="332" dy="0">12 份：正确放行</tspan><tspan x="332" dy="41.85">可以交付的候选</tspan></text><rect x="730" y="270" width="370" height="170" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="752" y="310" fill="#e9dfcd" font-size="27" font-weight="400"><tspan x="752" dy="0">2 份：漏检放行</tspan><tspan x="752" dy="41.85">错误草稿逃过检查</tspan></text><rect x="310" y="500" width="370" height="170" rx="10" fill="#183541" stroke="#ff918b" stroke-width="2"/><text x="332" y="540" fill="#e9dfcd" font-size="27" font-weight="400"><tspan x="332" dy="0">1 份：误拦</tspan><tspan x="332" dy="41.85">合格草稿被阻断</tspan></text><rect x="730" y="500" width="370" height="170" rx="10" fill="#183541" stroke="#a6d49f" stroke-width="2"/><text x="752" y="540" fill="#e9dfcd" font-size="27" font-weight="400"><tspan x="752" dy="0">5 份：正确拦截</tspan><tspan x="752" dy="41.85">缺陷进入修订分支</tspan></text><text x="50" y="760" fill="#ff918b" font-size="27" font-weight="650"><tspan x="50" dy="0">漏检率 = 2 / (2 + 5)</tspan></text><text x="620" y="760" fill="#ff918b" font-size="27" font-weight="650"><tspan x="620" dy="0">误拦率 = 1 / (12 + 1)</tspan></text><text x="50" y="825" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="50" dy="0">检查器处理这 20 份草稿；Eval 对照复核结果，计算检查器判断得准不准。</tspan></text><text x="50" y="885" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="50" dy="0">只统计“最终完成数”会丢掉修订次数、漏检与误拦，难以知道系统到底改进了什么。</tspan></text></g></svg>