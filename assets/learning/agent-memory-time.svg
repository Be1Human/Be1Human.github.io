<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">地点记忆的系统时间版本与有效时间</title><desc id="desc">10月10日的知识视图保留未设终点的深圳说法；10月20日更新后新增带结束日期的深圳版本和未确认的杭州计划。历史记录与新视图同时保留。</desc><rect width="1200" height="920" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="48" y="58" fill="#e9dfcd" font-size="32" font-weight="650">保存当时已知的说法</text><text x="48" y="96" fill="#a9bfc6" font-size="20" font-weight="400">有效时间与系统时间都保留版本；计划不自动变成到达事实</text><rect x="48" y="135" width="500" height="95" rx="9" fill="#173341" stroke="#bea7dd" stroke-width="2"/><text x="72" y="174" fill="#bea7dd" font-size="21" font-weight="400">10 月 1 日记录</text><text x="72" y="211" fill="#e9dfcd" font-size="23" font-weight="400">用户说：目前常驻深圳</text><rect x="652" y="135" width="500" height="95" rx="9" fill="#173341" stroke="#ff9c95" stroke-width="2"/><text x="676" y="174" fill="#ff9c95" font-size="21" font-weight="400">10 月 20 日记录</text><text x="676" y="211" fill="#e9dfcd" font-size="23" font-weight="400">用户计划：28 日起常驻杭州</text><text x="48" y="292" fill="#bea7dd" font-size="23" font-weight="600">系统视图：截至 10 月 10 日</text><text x="48" y="329" fill="#a9bfc6" font-size="19" font-weight="400">当时尚无杭州计划；旧记录没有已知的有效结束日</text><rect x="48" y="350" width="1104" height="74" rx="9" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="74" y="396" fill="#e9dfcd" font-size="22" font-weight="400">深圳说法  |  valid：10-01 ～ 未知终点  |  system：10-01 ～ 10-20</text><text x="48" y="485" fill="#bea7dd" font-size="23" font-weight="600">系统视图：截至 10 月 21 日</text><rect x="48" y="512" width="517" height="99" rx="9" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="73" y="552" fill="#8bccce" font-size="23" font-weight="600">深圳说法 v2</text><text x="73" y="588" fill="#e9dfcd" font-size="21" font-weight="400">valid：10-01 ～ 10-28</text><rect x="599" y="512" width="553" height="99" rx="9" fill="#173341" stroke="#ff9c95" stroke-width="2"/><text x="624" y="552" fill="#ff9c95" font-size="23" font-weight="600">杭州计划 v1 · 尚未确认搬迁</text><text x="624" y="588" fill="#e9dfcd" font-size="21" font-weight="400">valid：10-28 ～ 未知终点</text><text x="48" y="649" fill="#a9bfc6" font-size="20" font-weight="400">两个新版记录的 system_from 都是 10-20；旧版仍可用于历史查询。</text><rect x="48" y="687" width="350" height="112" rx="9" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="66" y="723" fill="#8bccce" font-size="17" font-weight="400">valid 10-25 / known 10-21</text><text x="66" y="771" fill="#e9dfcd" font-size="22" font-weight="400">按最新说法：深圳</text><rect x="425" y="687" width="350" height="112" rx="9" fill="#173341" stroke="#ff9c95" stroke-width="2"/><text x="443" y="723" fill="#ff9c95" font-size="17" font-weight="400">valid 11-01 / known 10-21</text><text x="443" y="771" fill="#e9dfcd" font-size="22" font-weight="400">按 20 日计划：杭州</text><rect x="802" y="687" width="350" height="112" rx="9" fill="#173341" stroke="#bea7dd" stroke-width="2"/><text x="820" y="723" fill="#bea7dd" font-size="17" font-weight="400">valid 11-01 / known 10-10</text><text x="820" y="771" fill="#e9dfcd" font-size="22" font-weight="400">当时仅有深圳说法</text><rect x="48" y="833" width="1104" height="53" rx="9" fill="#243245" stroke="#bea7dd" stroke-width="2"/><text x="70" y="867" fill="#bea7dd" font-size="22" font-weight="400">地点计划不能用于推断用户实际位置或出差出发地。</text></g></svg>