<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">MCP工具发现与调用的信任边界</title><desc id="desc">模型只提出工具请求。宿主传递协议调用并检查策略，MCP服务端在读取知识库前核验身份与记录范围。返回资料维持数据身份。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.4"/></marker></defs><rect width="1200" height="920" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="48" y="58" fill="#e9dfcd" font-size="32" font-weight="650" text-anchor="start">一次 MCP 调用的四段边界</text><text x="48" y="96" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">基于 2026-07-28 规范；请求示例查询授权知识库</text><rect x="20" y="132" width="210" height="55" rx="10" fill="#173341" stroke="#3d5b69" stroke-width="2"/><text x="125" y="167" fill="#e9dfcd" font-size="21" font-weight="600" text-anchor="middle">模型</text><path d="M125 198 V790" fill="none" stroke="#3d5b69" stroke-width="2.3" stroke-dasharray="7 6"/><rect x="290" y="132" width="210" height="55" rx="10" fill="#173341" stroke="#3d5b69" stroke-width="2"/><text x="395" y="167" fill="#e9dfcd" font-size="21" font-weight="600" text-anchor="middle">Host / Client</text><path d="M395 198 V790" fill="none" stroke="#3d5b69" stroke-width="2.3" stroke-dasharray="7 6"/><rect x="660" y="132" width="210" height="55" rx="10" fill="#173341" stroke="#3d5b69" stroke-width="2"/><text x="765" y="167" fill="#e9dfcd" font-size="21" font-weight="600" text-anchor="middle">MCP Server</text><path d="M765 198 V790" fill="none" stroke="#3d5b69" stroke-width="2.3" stroke-dasharray="7 6"/><rect x="970" y="132" width="210" height="55" rx="10" fill="#173341" stroke="#3d5b69" stroke-width="2"/><text x="1075" y="167" fill="#e9dfcd" font-size="21" font-weight="600" text-anchor="middle">知识库</text><path d="M1075 198 V790" fill="none" stroke="#3d5b69" stroke-width="2.3" stroke-dasharray="7 6"/><path d="M395 226 H765" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="580.0" y="213" fill="#8bccce" font-size="19" font-weight="400" text-anchor="middle">tools/list：读取工具目录</text><path d="M765 288 H395" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="580.0" y="275" fill="#8bccce" font-size="19" font-weight="400" text-anchor="middle">工具名 + 输入 schema</text><path d="M395 350 H125" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="260.0" y="337" fill="#8bccce" font-size="19" font-weight="400" text-anchor="middle">给模型相关工具定义</text><path d="M125 412 H395" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="260.0" y="399" fill="#8bccce" font-size="19" font-weight="400" text-anchor="middle">提议：query + version</text><rect x="288" y="433" width="214" height="45" rx="5" fill="#3d2d34" stroke="#ff9c95" stroke-width="2"/><text x="395" y="463" fill="#ff9c95" font-size="18" font-weight="400" text-anchor="middle">宿主检查调用策略</text><path d="M395 510 H765" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="580.0" y="497" fill="#8bccce" font-size="19" font-weight="400" text-anchor="middle">tools/call + 版本 / 能力元数据</text><path d="M765 567 H1075" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="920.0" y="554" fill="#8bccce" font-size="19" font-weight="400" text-anchor="middle">服务端核验身份与范围</text><path d="M1075 620 H765" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="920.0" y="607" fill="#8bccce" font-size="19" font-weight="400" text-anchor="middle">仅返回可读记录</text><rect x="48" y="820" width="1104" height="58" rx="5" fill="#243245" stroke="#bea7dd" stroke-width="2"/><text x="70" y="856" fill="#bea7dd" font-size="22" font-weight="400" text-anchor="start">返回资料属于证据；文档中的命令不会因此变成宿主指令。</text><path d="M765 681 H395" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="580" y="668" fill="#8bccce" font-size="19" text-anchor="middle">工具结果 + 来源记录</text><path d="M395 745 H125" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="260" y="732" fill="#8bccce" font-size="19" text-anchor="middle">相关片段进入下一轮</text></g></svg>