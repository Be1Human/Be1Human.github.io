<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">多Agent写入冲突与契约合并</title><desc id="desc">左侧两个Agent同时修改API字段导致冲突；右侧按后端契约和前端范围分工，由一个合并者核对基线、补丁与测试。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="48" y="58" fill="#e9dfcd" font-size="32" font-weight="650" text-anchor="start">并行结束后，合并才刚开始</text><text x="48" y="96" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">教学任务：同时修后端分页与前端列表</text><rect x="48" y="144" width="515" height="248" rx="10" fill="#173341" stroke="#ff9c95" stroke-width="2"/><text x="72" y="183" fill="#ff9c95" font-size="23" font-weight="600" text-anchor="start">无写入边界</text><rect x="78" y="214" width="190" height="66" rx="10" fill="#173341" stroke="#3d5b69" stroke-width="2"/><text x="96" y="256" fill="#e9dfcd" font-size="19" font-weight="400" text-anchor="start">Agent A 改 API</text><rect x="337" y="214" width="196" height="66" rx="10" fill="#173341" stroke="#3d5b69" stroke-width="2"/><text x="355" y="256" fill="#e9dfcd" font-size="19" font-weight="400" text-anchor="start">Agent B 改 API</text><path d="M174 288 V327 H299" fill="none" stroke="#ff9c95" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M435 288 V327 H313" fill="none" stroke="#ff9c95" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="185" y="312" width="242" height="55" rx="5" fill="#3d2d34" stroke="#ff9c95" stroke-width="2"/><text x="206" y="348" fill="#ff9c95" font-size="19" font-weight="400" text-anchor="start">同一文件 / 同一字段</text><rect x="637" y="144" width="515" height="248" rx="10" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="661" y="183" fill="#8bccce" font-size="23" font-weight="600" text-anchor="start">明确产物与合并者</text><rect x="662" y="214" width="211" height="66" rx="10" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="680" y="256" fill="#e9dfcd" font-size="19" font-weight="400" text-anchor="start">A：后端 + 契约</text><rect x="908" y="214" width="217" height="66" rx="10" fill="#173341" stroke="#bea7dd" stroke-width="2"/><text x="926" y="256" fill="#e9dfcd" font-size="19" font-weight="400" text-anchor="start">B：前端适配</text><path d="M766 288 V327 H834" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M1017 288 V327 H958" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="815" y="312" width="162" height="55" rx="5" fill="#203e47" stroke="#3d5b69" stroke-width="2"/><text x="835" y="348" fill="#e9dfcd" font-size="19" font-weight="400" text-anchor="start">单一合并者</text><text x="48" y="450" fill="#8bccce" font-size="24" font-weight="600" text-anchor="start">并行前先固定接口</text><rect x="48" y="478" width="1104" height="164" rx="10" fill="#142a36" stroke="#3d5b69" stroke-width="2"/><text x="74" y="518" fill="#bea7dd" font-size="20" font-weight="400" text-anchor="start">共同基线</text><text x="238" y="518" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">commit b42；响应字段由契约文件定义</text><text x="74" y="563" fill="#bea7dd" font-size="20" font-weight="400" text-anchor="start">写入范围</text><text x="238" y="563" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">A: server/* + contract.json；B: client/*</text><text x="74" y="608" fill="#bea7dd" font-size="20" font-weight="400" text-anchor="start">交接证据</text><text x="238" y="608" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">补丁、基线版本、测试命令、未解问题</text><text x="48" y="702" fill="#e9dfcd" font-size="22" font-weight="400" text-anchor="start">可独立验证的工作并行；共享状态在一个可检查的合并点收敛。</text></g></svg>