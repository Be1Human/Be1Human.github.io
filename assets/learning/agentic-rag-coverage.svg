<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">版本冲突下的检索补证</title><desc id="desc">一次旧版本命中被识别为不适用。系统按三条需要证明的断言补查迁移与管理员手册，最终输出带条件的结论。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.4"/></marker></defs><rect width="1200" height="760" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif"><text x="48" y="58" fill="#e9dfcd" font-size="32" font-weight="650" text-anchor="start">检索命中，仍可能答错</text><text x="48" y="96" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">问题：v2.1 升级后，旧账号还能批量导出吗？</text><rect x="48" y="138" width="402" height="178" rx="10" fill="#173341" stroke="#ff9c95" stroke-width="2"/><text x="72" y="178" fill="#ff9c95" font-size="23" font-weight="600" text-anchor="start">第一次命中：v1.8 手册</text><text x="72" y="220" fill="#e9dfcd" font-size="24" font-weight="400" text-anchor="start">“导出权限默认开启”</text><text x="72" y="266" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">相关：是  ·  适用版本：否</text><rect x="48" y="372" width="402" height="240" rx="10" fill="#173341" stroke="#3d5b69" stroke-width="2"/><text x="72" y="413" fill="#8bccce" font-size="23" font-weight="600" text-anchor="start">还要查清的问题</text><text x="72" y="461" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">① v2.1 默认是否开启</text><text x="72" y="510" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">② 旧账号是否自动迁移</text><text x="72" y="559" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">③ 管理员能否重新配置</text><path d="M470 227 H567 V201 H636" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="478" y="182" fill="#ff9c95" font-size="18" font-weight="400" text-anchor="start">发现版本缺口</text><rect x="652" y="138" width="500" height="150" rx="10" fill="#173341" stroke="#8bccce" stroke-width="2"/><text x="676" y="178" fill="#8bccce" font-size="23" font-weight="600" text-anchor="start">迁移说明 · v2.1</text><text x="676" y="221" fill="#e9dfcd" font-size="22" font-weight="400" text-anchor="start">默认关闭；旧授权不会自动继承</text><text x="676" y="262" fill="#a9bfc6" font-size="20" font-weight="400" text-anchor="start">已回答 ①②，仍缺 ③</text><path d="M902 294 V352" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><text x="926" y="333" fill="#a9bfc6" font-size="18" font-weight="400" text-anchor="start">继续查权限配置</text><rect x="652" y="366" width="500" height="126" rx="10" fill="#173341" stroke="#bea7dd" stroke-width="2"/><text x="676" y="407" fill="#bea7dd" font-size="23" font-weight="600" text-anchor="start">管理员手册 · v2.1</text><text x="676" y="451" fill="#e9dfcd" font-size="22" font-weight="400" text-anchor="start">管理员可显式授予 export.bulk</text><path d="M902 500 V551" fill="none" stroke="#8bccce" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="550" y="564" width="602" height="143" rx="10" fill="#1b3a43" stroke="#8bccce" stroke-width="2"/><text x="574" y="603" fill="#8bccce" font-size="22" font-weight="600" text-anchor="start">回答保留条件，不再只说“能”或“不能”</text><text x="574" y="645" fill="#e9dfcd" font-size="21" font-weight="400" text-anchor="start">默认不可用；管理员授予新权限后可用。</text><text x="574" y="680" fill="#a9bfc6" font-size="19" font-weight="400" text-anchor="start">引用：迁移说明 §3 + 管理员手册 §7</text><text x="48" y="704" fill="#a9bfc6" font-size="18" font-weight="400" text-anchor="start">原创教学文档集</text></g></svg>