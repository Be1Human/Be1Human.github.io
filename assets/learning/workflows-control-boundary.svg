<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Workflow和Agent控制权对比</title><desc id="desc">已知错误码任务用固定流程，缺失环境信息的任务需要根据工具观察动态调查，最后都经过确定性交付检查。</desc><defs><marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#ff918b" stroke-width="1.5"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a6d49f" stroke-width="1.5"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#b39acb" stroke-width="1.5"/></marker></defs><rect width="1200" height="1070" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="50" y="58" fill="#e9dfcd" font-size="32" font-weight="650"><tspan x="50" dy="0">“导入失败”不是同一种任务</tspan></text><text x="50" y="102" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="50" dy="0">控制流是否预先确定，取决于运行时还缺哪些事实</tspan></text><rect x="50" y="160" width="1100" height="80" rx="10" fill="#183541" stroke="#8bccce" stroke-width="2"/><text x="72" y="200" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="72" dy="0">输入 A：2.4 版，错误码 E_TIMEOUT，已附日志与配置</tspan></text><text x="50" y="290" fill="#8bccce" font-size="25" font-weight="650"><tspan x="50" dy="0">固定流程</tspan></text><rect x="50" y="325" width="300" height="125" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="72" y="365" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="72" dy="0">解析结构化字段</tspan><tspan x="72" dy="38.75">版本 / 错误码</tspan></text><path d="M365 385 L430 385" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><rect x="450" y="325" width="300" height="125" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="472" y="365" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="472" dy="0">命中已知规则</tspan><tspan x="472" dy="38.75">E_TIMEOUT → 超时模板</tspan></text><path d="M765 385 L830 385" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><rect x="850" y="325" width="300" height="125" rx="10" fill="#183541" stroke="#45616d" stroke-width="2"/><text x="872" y="365" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="872" dy="0">校验引用与字段</tspan><tspan x="872" dy="38.75">生成待确认草稿</tspan></text><rect x="50" y="500" width="1100" height="80" rx="10" fill="#183541" stroke="#b39acb" stroke-width="2"/><text x="72" y="540" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="72" dy="0">输入 B：只说“昨天还能用”，没有日志，环境也可能改变</tspan></text><text x="50" y="630" fill="#b39acb" font-size="25" font-weight="650"><tspan x="50" dy="0">开放调查</tspan></text><rect x="50" y="665" width="300" height="150" rx="10" fill="#183541" stroke="#b39acb" stroke-width="2"/><text x="72" y="705" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="72" dy="0">先选择缺口</tspan><tspan x="72" dy="38.75">读日志？查配置？</tspan></text><path d="M365 735 L430 735" fill="none" stroke="#b39acb" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="450" y="665" width="300" height="150" rx="10" fill="#183541" stroke="#b39acb" stroke-width="2"/><text x="472" y="705" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="472" dy="0">工具返回新证据</tspan><tspan x="472" dy="38.75">可能发现：DNS 失败</tspan></text><path d="M765 735 L830 735" fill="none" stroke="#b39acb" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="850" y="665" width="300" height="150" rx="10" fill="#183541" stroke="#b39acb" stroke-width="2"/><text x="872" y="705" fill="#e9dfcd" font-size="25" font-weight="400"><tspan x="872" dy="0">据观察换路径</tspan><tspan x="872" dy="38.75">转向网络诊断</tspan></text><path d="M1000 835 V880 H200 V835" fill="none" stroke="#b39acb" stroke-width="3" marker-end="url(#arrow-purple)"/><text x="425" y="920" fill="#b39acb" font-size="23" font-weight="400"><tspan x="425" dy="0">下一步动作随观察改变</tspan></text><text x="50" y="985" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="50" dy="0">混合架构：固定身份/权限/交付检查，把不确定的调查段交给有界 Agent。</tspan></text><text x="50" y="1030" fill="#a5b6ba" font-size="20" font-weight="400"><tspan x="50" dy="0">原创对照图。两个输入属于同一业务，但运行时的不确定性不同。</tspan></text></g></svg>