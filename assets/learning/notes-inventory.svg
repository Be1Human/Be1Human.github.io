<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">挖掘动作与背包事实的区别</title><desc id="desc">教学目标要求背包至少四个原木，工具成功返回后背包仍只有一个，拾取后达到四个才满足条件。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="m1 1 6 3-6 3" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker></defs><rect width="1200" height="620" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="48" y="65" fill="#e9dfcd" font-size="32" font-weight="650">完成条件：背包里至少 4 个原木</text><text x="48" y="106" fill="#a5b6ba" font-size="20">教学验收轨迹，不是项目实测日志。</text><path d="M185 190H1030" stroke="#648693" stroke-width="3" marker-end="url(#arrow)"/><g fill="#8bccce"><circle cx="210" cy="190" r="8"/><circle cx="600" cy="190" r="8"/><circle cx="990" cy="190" r="8"/></g><text x="90" y="159" fill="#a5b6ba" font-size="21">T0 / 接到目标</text><text x="474" y="159" fill="#a5b6ba" font-size="21">T1 / 挖掘返回</text><text x="868" y="159" fill="#a5b6ba" font-size="21">T2 / 拾取完成</text><g fill="#193441" stroke="#425e6d"><rect x="48" y="235" width="325" height="235" rx="9"/><rect x="438" y="235" width="325" height="235" rx="9"/><rect x="828" y="235" width="325" height="235" rx="9"/></g><g fill="#e9dfcd" font-size="25"><text x="78" y="282">背包：1</text><text x="468" y="282">工具：success</text><text x="858" y="282">背包：4</text></g><g font-family="Consolas,monospace" font-size="64"><text x="78" y="372" fill="#b39acb">1 &lt; 4</text><text x="468" y="372" fill="#ff918b">1 &lt; 4</text><text x="858" y="372" fill="#8bccce">4 ≥ 4</text></g><g fill="#a5b6ba" font-size="21"><text x="78" y="425">还差 3 个</text><text x="468" y="425">掉落物尚未入包</text><text x="858" y="425">验收条件满足</text></g><path d="M600 482v35H210" fill="none" stroke="#ff918b" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="566" fill="#e9dfcd" font-size="24">T1 应继续检查或拾取，不能凭工具返回就报告完成。</text></g></svg>