<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc"><title id="title">超时后重复创建工单的时间线</title><desc id="desc">第一次请求在客户端超时前已经写入，第二次请求又创建一条。两次网络状态与两次数据库提交必须关联。</desc><rect width="1200" height="740" rx="14" fill="#132b38"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="55" y="65" font-size="34" fill="#f1e8d8" font-weight="650" text-anchor="start">客户端超时，数据库已经写完</text><text x="55" y="104" font-size="19" fill="#c6d5d7" font-weight="400" text-anchor="start">原创教学时间线 · 时间单位 ms；不是线上性能测量</text><path d="M260.0 159V485" stroke="#2e4b5a" stroke-dasharray="4 5"/><text x="260.0" y="150" font-size="16" fill="#9bb0b8" font-weight="400" text-anchor="middle">0</text><path d="M420.0 159V485" stroke="#2e4b5a" stroke-dasharray="4 5"/><text x="420.0" y="150" font-size="16" fill="#9bb0b8" font-weight="400" text-anchor="middle">500</text><path d="M580.0 159V485" stroke="#2e4b5a" stroke-dasharray="4 5"/><text x="580.0" y="150" font-size="16" fill="#9bb0b8" font-weight="400" text-anchor="middle">1000</text><path d="M740.0 159V485" stroke="#2e4b5a" stroke-dasharray="4 5"/><text x="740.0" y="150" font-size="16" fill="#9bb0b8" font-weight="400" text-anchor="middle">1500</text><path d="M900.0 159V485" stroke="#2e4b5a" stroke-dasharray="4 5"/><text x="900.0" y="150" font-size="16" fill="#9bb0b8" font-weight="400" text-anchor="middle">2000</text><path d="M1060.0 159V485" stroke="#2e4b5a" stroke-dasharray="4 5"/><text x="1060.0" y="150" font-size="16" fill="#9bb0b8" font-weight="400" text-anchor="middle">2500</text><text x="55" y="216" font-size="20" fill="#c6d5d7" font-weight="400" text-anchor="start">任务 run-42</text><text x="55" y="295" font-size="20" fill="#c6d5d7" font-weight="400" text-anchor="start">客户端尝试 1</text><text x="55" y="374" font-size="20" fill="#c6d5d7" font-weight="400" text-anchor="start">客户端尝试 2</text><text x="55" y="453" font-size="20" fill="#c6d5d7" font-weight="400" text-anchor="start">数据库提交</text><rect x="260" y="192" width="768" height="32" rx="8" fill="#2b5361" stroke="#45616d"/><rect x="324" y="268" width="256" height="37" rx="8" fill="#68434b" stroke="#45616d"/><text x="337" y="294" font-size="17" fill="#ffb0aa" font-weight="400" text-anchor="start">等待响应 → timeout</text><rect x="644" y="347" width="160" height="37" rx="8" fill="#2b594d" stroke="#45616d"/><text x="657" y="373" font-size="17" fill="#b9e6cd" font-weight="400" text-anchor="start">201 / 成功</text><circle cx="404.0" cy="445" r="8" fill="#ffb0aa"/><text x="404.0" y="478" font-size="18" fill="#ffb0aa" font-weight="400" text-anchor="middle">工单 A</text><circle cx="724.0" cy="445" r="8" fill="#ffb0aa"/><text x="724.0" y="478" font-size="18" fill="#ffb0aa" font-weight="400" text-anchor="middle">工单 B</text><path d="M404 435V317H580" stroke="#ffb0aa" fill="none" stroke-dasharray="5 5"/><text x="419" y="333" font-size="17" fill="#ffb0aa" font-weight="400" text-anchor="start">已提交，响应丢失</text><rect x="55" y="535" width="518" height="120" rx="8" fill="#203743" stroke="#42616c"/><text x="80" y="574" font-size="23" fill="#ffb0aa" font-weight="600" text-anchor="start">错误恢复</text><text x="80" y="610" font-size="20" fill="#c6d5d7" font-weight="400" text-anchor="start">新请求 ID → 第二次创建 → 两条记录</text><rect x="608" y="535" width="534" height="120" rx="8" fill="#203d44" stroke="#52776f"/><text x="633" y="574" font-size="23" fill="#99e0c2" font-weight="600" text-anchor="start">重试时避免重复创建</text><text x="633" y="610" font-size="20" fill="#c6d5d7" font-weight="400" text-anchor="start">同一逻辑操作键 → 查询或返回原记录</text><text x="55" y="707" font-size="19" fill="#9bb0b8" font-weight="400" text-anchor="start">Trace 说明发生了什么；数据库快照才能确认最终到底写了几条。</text></g></svg>