<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">工具调用的往返时序</title><desc id="desc">模型提出带调用ID的请求，宿主验证参数与身份后读取文档，结果以相同调用ID回传下一轮模型。</desc><defs><marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#8bccce" stroke-width="1.5"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#ff918b" stroke-width="1.5"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a6d49f" stroke-width="1.5"/></marker><marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#b39acb" stroke-width="1.5"/></marker></defs><rect width="1200" height="1010" fill="#10232e"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="50" y="58" fill="#e9dfcd" font-size="32" font-weight="650"><tspan x="50" dy="0">一次工具调用，要跨过四次交接</tspan></text><text x="50" y="102" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="50" dy="0">教学接口：读取授权文档中的指定行；工具名、参数和结果各有独立归属</tspan></text><text x="60" y="170" fill="#b39acb" font-size="26" font-weight="650"><tspan x="60" dy="0">模型</tspan></text><text x="355" y="170" fill="#8bccce" font-size="26" font-weight="650"><tspan x="355" dy="0">宿主程序</tspan></text><text x="700" y="170" fill="#a6d49f" font-size="26" font-weight="650"><tspan x="700" dy="0">文档存储</tspan></text><path d="M120 200 V855" stroke="#45616d" stroke-dasharray="6 7"/><path d="M470 200 V855" stroke="#45616d" stroke-dasharray="6 7"/><path d="M830 200 V855" stroke="#45616d" stroke-dasharray="6 7"/><text x="175" y="245" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="175" dy="0">tool_use / id=call_17</tspan><tspan x="175" dy="35.65">read_document(doc_id=&quot;manual-24&quot;,</tspan><tspan x="175" dy="35.65">start_line=10, end_line=14)</tspan></text><path d="M120 355 L470 355" fill="none" stroke="#b39acb" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="355" y="390" width="430" height="120" rx="10" fill="#183541" stroke="#8bccce" stroke-width="2"/><text x="377" y="430" fill="#e9dfcd" font-size="24" font-weight="400"><tspan x="377" dy="0">① 校验参数类型与范围</tspan><tspan x="377" dy="37.2">② 按当前身份检查文档权限</tspan></text><path d="M470 550 L830 550" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><text x="510" y="590" fill="#a5b6ba" font-size="22" font-weight="400"><tspan x="510" dy="0">读取 manual-24 的 10–14 行</tspan></text><path d="M830 655 L470 655" fill="none" stroke="#a6d49f" stroke-width="3" marker-end="url(#arrow-green)"/><text x="505" y="700" fill="#a6d49f" font-size="22" font-weight="400"><tspan x="505" dy="0">返回 version=2.4、行号、正文</tspan><tspan x="505" dy="34.1">或显式 not_found / forbidden</tspan></text><path d="M470 785 L120 785" fill="none" stroke="#8bccce" stroke-width="3" marker-end="url(#arrow-cyan)"/><text x="175" y="830" fill="#e9dfcd" font-size="23" font-weight="400"><tspan x="175" dy="0">tool_result / tool_use_id=call_17</tspan><tspan x="175" dy="35.65">写回下一轮消息，模型才获得新证据</tspan></text><text x="50" y="925" fill="#ff918b" font-size="23" font-weight="400"><tspan x="50" dy="0">调用请求 ≠ 已执行；Schema 合法 ≠ 有权限；收到结果 ≠ 任务已完成。</tspan></text><text x="50" y="970" fill="#a5b6ba" font-size="20" font-weight="400"><tspan x="50" dy="0">原创时序图。身份与权限由宿主提供，不由模型在参数中自报。</tspan></text></g></svg>